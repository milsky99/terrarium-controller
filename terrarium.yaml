# Terrarium Controller - public release build 
#
# Change project_version below and push to release a new firmware version.
# Devices already in the field will see the new version within 6 hours
# and offer it as an update.

substitutions:
  device_name: plant
  device_friendly_name: Plant
  project_version: "1.0.7"
  manifest_url: https://milsky99.github.io/terrarium-controller/firmware/manifest.json

# Board: Generic ESP32 Board (Generic)
esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  # Adds the last 3 bytes of the chip address to the name, so every unit
  # is unique on the network from a single firmware build.
  name_add_mac_suffix: true
  project:
    name: milsky99.plant
    version: "${project_version}"
  on_boot:
    priority: 600
    then:
      - switch.turn_off: mister_relay
      - fan.turn_off: mister_fan
      - light.turn_off: puc_light
      - lambda: |-
          id(last_mist_text).publish_state("Never");
          id(last_fan_text).publish_state("Never");
          id(last_light_text).publish_state("Never");
          id(last_setting_text).publish_state("Never");
          id(last_boot_text).publish_state("waiting for clock");
      - script.execute: rebuild_schedule
      - if:
          condition:
            switch.is_on: fan_cycle_enable
          then:
            - script.execute: fan_cycle_loop

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      # Smaller firmware. Only safe because you control which boards ship.
      # Will NOT run on ESP32 chips older than revision 3.1.
      minimum_chip_revision: "3.1"

# Lets Home Assistant offer a one click adopt for this device.
dashboard_import:
  package_import_url: github://milsky99/terrarium-controller/terrarium.yaml@main
  import_full_config: false

logger:
  # level decides what is built into the firmware at all.
  # initial_level then hides it, so the device is quiet by default.
  # The tags below are switched back on, and only those are shown.
  # Result: mist, fan, light and slider changes appear. Nothing else.
  level: VERBOSE
  initial_level: WARN
  logs:
    switch: VERBOSE
    light: VERBOSE
    fan: VERBOSE
    number: VERBOSE

# No encryption key here on purpose. A key baked into public firmware
# would be readable by anyone. Home Assistant still finds and adopts it.
# reboot_timeout 0s stops the unit rebooting every 15 minutes when no
# Home Assistant is present. Most owners will not have one.
api:
  reboot_timeout: 0s

ota:
  - platform: esphome
  - platform: http_request
    on_progress:
      - lambda: |-
          char b[48];
          snprintf(b, sizeof(b), "Downloading... %.0f%%", x);
          id(update_status_text).publish_state(std::string(b));
    on_error:
      - lambda: |-
          id(update_status_text).publish_state("Update failed - try again later");

# Used to fetch the update manifest and the new firmware.
http_request:
  verify_ssl: true
  timeout: 10s

update:
  - platform: http_request
    name: "Firmware Update"
    id: fw_update
    source: ${manifest_url}
    update_interval: 6h
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 60

# No network saved. On first boot the unit starts its own open hotspot
# named after the device, so the code shown in the phone's WiFi list is
# the same code used to reach the unit later.
# reboot_timeout 0s means a router outage does not interrupt misting.
# The fallback hotspot still appears when the network is genuinely gone.
wifi:
  reboot_timeout: 0s
  ap:

captive_portal:

web_server:
  version: 3
  sorting_groups:
    - id: grp_system
      name: "System"
      sorting_weight: 10
    - id: grp_light
      name: "Light"
      sorting_weight: 20
    - id: grp_water
      name: "Water"
      sorting_weight: 25
    - id: grp_cal
      name: "Water Calibration"
      sorting_weight: 60
    - id: grp_mist
      name: "Mister"
      sorting_weight: 30
    - id: grp_fan
      name: "Fan"
      sorting_weight: 40
    - id: grp_history
      name: "History"
      sorting_weight: 70
    - id: grp_reset
      name: "Reset"
      sorting_weight: 200

time:
  - platform: sntp
    id: board_time
    timezone: Africa/Johannesburg
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        - lambda: |-
            if (!id(boot_logged)) {
              id(boot_logged) = true;
              id(last_boot_text).publish_state(id(board_time).now().strftime("%a %H:%M"));
            }
        - component.update: clock_status
        - script.execute: rebuild_schedule
        - script.execute: light_check
    on_time:
      - seconds: 0
        minutes: 0
        then:
          - script.execute: light_check
          - if:
              condition:
                and:
                  - switch.is_on: mist_enable
                  - lambda: |-
                      int h = id(board_time).now().hour;
                      for (int i = 0; i < id(mist_hours_n); i++) {
                        if (id(mist_hours)[i] == h) return true;
                      }
                      return false;
              then:
                - script.execute: mister_cycle

globals:
  - id: led_tick
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: led_state
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: fan_auto
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: boot_logged
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: mist_hours
    type: int[6]
    restore_value: no

  - id: mist_hours_n
    type: int
    restore_value: no
    initial_value: '0'

  # ----- Stored calibration, survives restarts and reflashes -----
  - id: cal_full
    type: float
    restore_value: yes
    initial_value: '500.0'

  - id: cal_empty
    type: float
    restore_value: yes
    initial_value: '1403.0'

  # What happened last: 0 never, 1 full set, 2 empty set, 3 rejected
  - id: cal_last
    type: int
    restore_value: yes
    initial_value: '0'

  - id: cal_value
    type: float
    restore_value: yes
    initial_value: '0.0'

  - id: cal_time
    type: uint32_t
    restore_value: yes
    initial_value: '0'

# ----- Capacitive water probe hub -----
# LEAVE setup_mode ON. The raw value only keeps updating while this is true.
# Turning it off freezes get_value(), which freezes every average below it.
esp32_touch:
  id: touch_hub
  setup_mode: true

binary_sensor:
  # The probe itself. Hidden, it exists only to feed the raw reading.
  # Its threshold is required by ESPHome but is NOT used for any decisions.
  - platform: esp32_touch
    id: water_probe
    pin: GPIO32
    threshold: 1000
    internal: true

  # Low when the percentage drops below the Minimum Water Level slider.
  - platform: template
    id: water_low
    internal: true
    lambda: |-
      if (std::isnan(id(water_percent).state)) return {};
      return id(water_percent).state < id(min_water_level).state;
    filters:
      - delayed_on: 30s
      - delayed_off: 30s
    on_press:
      - if:
          condition:
            and:
              - switch.is_on: water_control
              - switch.is_on: mister
          then:
            - script.execute: mister_stop

sensor:
  - platform: wifi_signal
    id: wifi_signal_db
    internal: true
    update_interval: 60s

  # ----- Water probe -----
  # Samples once a second. Hidden, it only feeds the averages below.
  - platform: template
    id: touch_raw
    internal: true
    lambda: 'return id(water_probe).get_value();'
    update_interval: 1s

  - platform: copy
    source_id: touch_raw
    name: "Probe 10 second"
    id: touch_avg_10s
    icon: "mdi:blur"
    unit_of_measurement: "counts"
    state_class: measurement
    accuracy_decimals: 1
    web_server:
      sorting_group_id: grp_water
      sorting_weight: 30
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

  # This is the one that drives the percentage and the automation.
  - platform: copy
    source_id: touch_raw
    name: "Probe 3 minute"
    id: touch_avg_3m
    icon: "mdi:blur"
    unit_of_measurement: "counts"
    state_class: measurement
    accuracy_decimals: 1
    web_server:
      sorting_group_id: grp_water
      sorting_weight: 40
    filters:
      - sliding_window_moving_average:
          window_size: 180
          send_every: 5

  - platform: copy
    source_id: touch_raw
    name: "Probe 10 minute"
    id: touch_avg_10m
    icon: "mdi:blur"
    unit_of_measurement: "counts"
    state_class: measurement
    accuracy_decimals: 1
    web_server:
      sorting_group_id: grp_water
      sorting_weight: 60
    filters:
      - sliding_window_moving_average:
          window_size: 600
          send_every: 15

  # Percentage worked out from the stored calibration.
  # Works whichever way round full and empty are.
  - platform: template
    name: "Water Level"
    id: water_percent
    icon: "mdi:water-percent"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    web_server:
      sorting_group_id: grp_water
      sorting_weight: 25
    lambda: |-
      float v = id(touch_avg_3m).state;
      if (std::isnan(v)) return {};
      float f = id(cal_full);
      float e = id(cal_empty);
      if (fabsf(f - e) < 1.0f) return {};
      float p = (v - e) / (f - e) * 100.0f;
      if (p < 0.0f) p = 0.0f;
      if (p > 100.0f) p = 100.0f;
      return p;

  # ----- Calibration readouts -----
  - platform: template
    name: "Calibrated Full"
    id: cal_full_display
    icon: "mdi:cup-water"
    unit_of_measurement: "counts"
    accuracy_decimals: 0
    update_interval: 30s
    web_server:
      sorting_group_id: grp_cal
      sorting_weight: 30
    lambda: 'return id(cal_full);'

  - platform: template
    name: "Calibrated Empty"
    id: cal_empty_display
    icon: "mdi:cup-outline"
    unit_of_measurement: "counts"
    accuracy_decimals: 0
    update_interval: 30s
    web_server:
      sorting_group_id: grp_cal
      sorting_weight: 40
    lambda: 'return id(cal_empty);'

button:
  # ----- System -----
  - platform: restart
    name: "Restart"
    icon: "mdi:restart"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 70

  - platform: template
    name: "Restore Settings To Defaults"
    icon: "mdi:backup-restore"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 71
    on_press:
      - script.execute: restore_defaults

  # ----- Reset, shown at the very bottom -----
  - platform: factory_reset
    name: "Erase Everything And Start Again"
    icon: "mdi:alert-octagon-outline"
    web_server:
      sorting_group_id: grp_reset
      sorting_weight: 10

  # ----- Firmware -----
  - platform: template
    name: "Check For Update"
    icon: "mdi:cloud-search-outline"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 61
    on_press:
      - script.execute: note_checking
      - update.check:
          id: fw_update

  - platform: template
    name: "Install Update"
    icon: "mdi:cloud-download-outline"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 62
    on_press:
      - if:
          condition:
            update.is_available:
              id: fw_update
          then:
            - lambda: id(update_status_text).publish_state("Starting download...");
            - update.perform:
                id: fw_update

  - platform: template
    name: "Set Full"
    icon: "mdi:cup-water"
    web_server:
      sorting_group_id: grp_cal
      sorting_weight: 10
    on_press:
      - script.execute:
          id: store_calibration
          is_full: true

  - platform: template
    name: "Set Empty"
    icon: "mdi:cup-outline"
    web_server:
      sorting_group_id: grp_cal
      sorting_weight: 20
    on_press:
      - script.execute:
          id: store_calibration
          is_full: false

text_sensor:
  # Plain english report of what the update system is doing.
  - platform: template
    name: "Update Status"
    id: update_status_text
    icon: "mdi:cloud-sync-outline"
    update_interval: never
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 63

  - platform: template
    name: "Installed Version"
    id: installed_version_text
    icon: "mdi:tag-check-outline"
    update_interval: 300s
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 64
    lambda: 'return {"${project_version}"};'

  # If the build rejects this block, delete it. The Update Status line
  # still reports when a new version is waiting, just without the number.
  - platform: template
    name: "Available Version"
    id: available_version_text
    icon: "mdi:tag-arrow-up-outline"
    update_interval: 300s
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 65
    lambda: |-
      std::string v = id(fw_update)->update_info.latest_version;
      if (v.empty()) return {"not checked yet"};
      return {v};

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 50
    ssid:
      name: "Network Name"
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 20
    bssid:
      name: "Router ID"
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 30

  - platform: template
    name: "Clock"
    id: clock_status
    icon: "mdi:clock-outline"
    update_interval: 30s
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 10
    lambda: |-
      auto t = id(board_time).now();
      if (!t.is_valid()) {
        return {"Could not retrieve the time, not connected to the internet, daily misting schedule is not available"};
      }
      return {t.strftime("%H:%M  %a %d %b %Y")};

  - platform: template
    name: "Signal Strength"
    id: wifi_signal_text
    icon: "mdi:wifi"
    update_interval: 300s
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 40
    lambda: |-
      float db = id(wifi_signal_db).state;
      if (std::isnan(db)) return {"no reading"};
      if (db >= -55) return {"████  Excellent"};
      if (db >= -67) return {"███░  Good"};
      if (db >= -75) return {"██░░  Fair"};
      if (db >= -85) return {"█░░░  Weak"};
      return {"░░░░  Very weak"};

  - platform: template
    name: "Water Status"
    id: water_status_text
    icon: "mdi:water-check"
    update_interval: 5s
    web_server:
      sorting_group_id: grp_water
      sorting_weight: 20
    lambda: |-
      if (!id(water_control).state) {
        return {"Water check off - misting always allowed"};
      }
      if (std::isnan(id(water_percent).state)) {
        return {"Warming up - waiting for a stable reading"};
      }
      if (id(water_low).state) {
        return {"Water low ! - automation off"};
      }
      return {"Water level ok - automation running"};

  # ----- Calibration -----
  - platform: template
    name: "Warning"
    id: reset_warning
    icon: "mdi:alert-outline"
    update_interval: 300s
    web_server:
      sorting_group_id: grp_reset
      sorting_weight: 5
    lambda: |-
      return {"This erases everything, including the WiFi details, and returns the unit to how it left the factory. You will have to set it up again from the start. There is no undo."};

  - platform: template
    name: "Important"
    id: cal_warning
    icon: "mdi:alert-outline"
    update_interval: 300s
    web_server:
      sorting_group_id: grp_cal
      sorting_weight: 4
    lambda: |-
      return {"The mister is damaged by running dry. Keep Water Level Control switched on and check the calibration regularly."};

  - platform: template
    name: "How To Calibrate"
    id: cal_help
    icon: "mdi:information-outline"
    update_interval: 300s
    web_server:
      sorting_group_id: grp_cal
      sorting_weight: 5
    lambda: |-
      return {"Fill the tank, wait 3 minutes, press Set Full. Lift the sensor wire out of the small hole, wait 3 minutes, press Set Empty. Push the wire all the way back down."};

  - platform: template
    name: "Calibration Status"
    id: cal_status_text
    icon: "mdi:tune-vertical"
    update_interval: 10s
    web_server:
      sorting_group_id: grp_cal
      sorting_weight: 50
    lambda: |-
      char b[120];
      if (id(cal_last) == 0) {
        return {"Never calibrated - using built in values"};
      }
      std::string ts = "no clock";
      if (id(cal_time) > 0) {
        ts = ESPTime::from_epoch_local(id(cal_time)).strftime("%a %H:%M");
      }
      if (id(cal_last) == 3) {
        snprintf(b, sizeof(b), "Rejected %.0f - too close to the other value. Nothing changed. %s",
                 id(cal_value), ts.c_str());
      } else {
        snprintf(b, sizeof(b), "%s set to %.0f - %s",
                 id(cal_last) == 1 ? "Full" : "Empty", id(cal_value), ts.c_str());
      }
      return {std::string(b)};

  - platform: template
    name: "Mist Times"
    id: mist_schedule_text
    icon: "mdi:calendar-clock"
    update_interval: never
    web_server:
      sorting_group_id: grp_mist
      sorting_weight: 30
    lambda: |-
      std::string s = "";
      char buf[8];
      for (int i = 0; i < id(mist_hours_n); i++) {
        snprintf(buf, sizeof(buf), "%02d:00", id(mist_hours)[i]);
        if (i > 0) s += ", ";
        s += buf;
      }
      if (s.empty()) s = "none";
      return {s};

  # Plain english readout of the burst pattern
  - platform: template
    name: "Mist Pattern"
    id: mist_pattern_text
    icon: "mdi:chart-timeline-variant"
    update_interval: 30s
    web_server:
      sorting_group_id: grp_mist
      sorting_weight: 85
    lambda: |-
      int on = (int) id(mist_on_seconds).state;
      int off = 30 - on;
      char b[80];
      if (on <= 0) {
        return {"Off time only - the mister will not run"};
      }
      if (off <= 0) {
        return {"Runs without stopping for the whole mist duration"};
      }
      snprintf(b, sizeof(b), "%d sec on, %d sec off, repeating", on, off);
      return {std::string(b)};

  # ----- History -----
  - platform: template
    name: "Last Mist"
    id: last_mist_text
    icon: "mdi:sprinkler-variant"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 10

  - platform: template
    name: "Last Fan Run"
    id: last_fan_text
    icon: "mdi:fan"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 20

  - platform: template
    name: "Last Light Change"
    id: last_light_text
    icon: "mdi:lightbulb"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 30

  - platform: template
    name: "Last Setting Change"
    id: last_setting_text
    icon: "mdi:tune"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 40

  - platform: template
    name: "Last Boot"
    id: last_boot_text
    icon: "mdi:restart"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 50

  # ----- Rolling log of the last 10 events, newest first -----
  # Held in memory only. A power cut empties it. Writing every event to
  # flash would wear the chip out, so it is deliberately not saved.
  - platform: template
    name: "1"
    id: hist1
    icon: "mdi:history"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 101
  - platform: template
    name: "2"
    id: hist2
    icon: "mdi:history"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 102
  - platform: template
    name: "3"
    id: hist3
    icon: "mdi:history"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 103
  - platform: template
    name: "4"
    id: hist4
    icon: "mdi:history"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 104
  - platform: template
    name: "5"
    id: hist5
    icon: "mdi:history"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 105
  - platform: template
    name: "6"
    id: hist6
    icon: "mdi:history"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 106
  - platform: template
    name: "7"
    id: hist7
    icon: "mdi:history"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 107
  - platform: template
    name: "8"
    id: hist8
    icon: "mdi:history"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 108
  - platform: template
    name: "9"
    id: hist9
    icon: "mdi:history"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 109
  - platform: template
    name: "10"
    id: hist10
    icon: "mdi:history"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 110

text:
  # A label the owner can set themselves, so several units can be told
  # apart. It does NOT change the page title or the network name, both of
  # which are fixed when the firmware is built.
  - platform: template
    name: "Unit Name"
    id: unit_label
    icon: "mdi:tag-outline"
    optimistic: true
    restore_value: true
    initial_value: "My Terrarium"
    min_length: 0
    max_length: 30
    mode: text
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 5
    on_value:
      - lambda: |-
          id(note_setting)->execute(std::string("Unit Name changed"));

number:
  # ----- Water -----
  # Misting stops below this percentage, as long as Water Level Control is on.
  - platform: template
    name: "Minimum Water Level"
    id: min_water_level
    icon: "mdi:water-alert-outline"
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 15
    max_value: 40
    step: 5
    unit_of_measurement: "%"
    mode: slider
    web_server:
      sorting_group_id: grp_water
      sorting_weight: 15
    on_value:
      - lambda: |-
          char b[64];
          snprintf(b, sizeof(b), "Minimum Water Level to %.0f%%", x);
          id(note_setting)->execute(std::string(b));

  # ----- Light -----
  - platform: template
    name: "Light On Hour"
    id: light_start_hour
    icon: "mdi:weather-sunny"
    optimistic: true
    restore_value: true
    initial_value: 12
    min_value: 0
    max_value: 23
    step: 1
    unit_of_measurement: "h"
    mode: slider
    web_server:
