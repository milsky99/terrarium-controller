          char b[72];
          if (x < 1) {
            id(note_setting)->execute(std::string("Fan Run After Mist off"));
          } else {
            snprintf(b, sizeof(b), "Fan Run After Mist to %.0f min", x);
            id(note_setting)->execute(std::string(b));
          }

# ----- Board LED status light -----
# Short blink every 3 seconds: running normally.
# Twice a second: water low, or no clock so the mist schedule cannot run.
# The clock warning is held back for the first 5 minutes after power up,
# so a new unit does not appear faulty while it finds the time.
interval:
  - interval: 100ms
    then:
      - lambda: |-
          id(led_tick)++;

          bool problem = false;
          if (id(water_control).state && id(water_low).state) {
            problem = true;
          }
          if (millis() > 300000 && !id(board_time).now().is_valid()) {
            problem = true;
          }

          bool want = problem ? ((id(led_tick) % 5) < 2)
                              : ((id(led_tick) % 30) < 1);

          if (want != id(led_state)) {
            id(led_state) = want;
            if (want) {
              id(internalled).turn_on();
            } else {
              id(internalled).turn_off();
            }
          }

output:
  - platform: gpio
    pin: GPIO23
    id: internalled
  - platform: gpio
    pin: GPIO26
    id: light_output
  - platform: gpio
    pin: GPIO17
    id: fan_output

light:
  - platform: binary
    name: "Light"
    id: puc_light
    output: light_output
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: grp_light
      sorting_weight: 10
    on_turn_on:
      - lambda: id(note_light)->execute(std::string("on"));
    on_turn_off:
      - lambda: id(note_light)->execute(std::string("off"));

fan:
  - platform: binary
    name: "Fan"
    id: mister_fan
    output: fan_output
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: grp_fan
      sorting_weight: 10
    on_turn_off:
      - if:
          condition:
            lambda: 'return !id(fan_auto);'
          then:
            - if:
                condition:
                  switch.is_on: mister
                then:
                  - script.execute: mister_stop
                else:
                  - if:
                      condition:
                        lambda: 'return id(fan_runon_time).state >= 1;'
                      then:
                        - script.execute: fan_delayed_off

script:
  # Puts every setting back to its factory value. Leaves the WiFi details,
  # the unit name and the firmware alone.
  - id: restore_defaults
    mode: single
    then:
      - lambda: |-
          id(min_water_level).publish_state(20);
          id(light_start_hour).publish_state(12);
          id(light_end_hour).publish_state(22);
          id(mist_start_hour).publish_state(8);
          id(mist_end_hour).publish_state(15);
          id(mist_count).publish_state(2);
          id(mister_run_time).publish_state(5);
          id(mist_on_seconds).publish_state(22);
          id(fan_cycle_hours).publish_state(4);
          id(fan_purge_seconds).publish_state(30);
          id(fan_runon_time).publish_state(0);

          id(cal_full) = 500.0f;
          id(cal_empty) = 1403.0f;
          id(cal_last) = 0;
          id(cal_value) = 0.0f;
          id(cal_time) = 0;
      - switch.turn_on: water_control
      - switch.turn_on: light_auto_enable
      - switch.turn_on: fan_cycle_enable
      - switch.turn_off: mist_enable
      - switch.turn_off: mister
      - script.execute: rebuild_schedule
      - component.update: cal_status_text
      - component.update: cal_full_display
      - component.update: cal_empty_display
      - script.execute:
          id: note_history
          what: !lambda 'return "settings restored to defaults";'

  # Shows a brief acknowledgement when Check For Update is pressed, then
  # clears it. Nothing is left behind that could later be out of date.
  - id: note_checking
    mode: restart
    then:
      - lambda: id(update_status_text).publish_state("Checking for updates...");
      - delay: 10s
      - lambda: id(update_status_text).publish_state("");

  # Stores the current 3 minute average as full or empty.
  # Refuses if the two points would end up within 100 counts of each other.
  - id: store_calibration
    mode: single
    parameters:
      is_full: bool
    then:
      - lambda: |-
          float v = id(touch_avg_3m).state;
          auto n = id(board_time).now();
          id(cal_time) = n.is_valid() ? n.timestamp : 0;

          if (std::isnan(v)) {
            id(cal_last) = 3;
            id(cal_value) = 0;
            return;
          }

          float other = is_full ? id(cal_empty) : id(cal_full);
          if (fabsf(v - other) < 100.0f) {
            id(cal_last) = 3;
            id(cal_value) = v;
            return;
          }

          if (is_full) {
            id(cal_full) = v;
            id(cal_last) = 1;
          } else {
            id(cal_empty) = v;
            id(cal_last) = 2;
          }
          id(cal_value) = v;
      - component.update: cal_status_text
      - component.update: cal_full_display
      - component.update: cal_empty_display

  # ----- History helpers -----
  # Pushes one line onto the rolling log, shifting everything down.
  - id: note_history
    mode: single
    parameters:
      what: string
    then:
      - lambda: |-
          auto t = id(board_time).now();
          std::string ts = t.is_valid() ? t.strftime("%a %H:%M") : std::string("no clock");
          esphome::text_sensor::TextSensor *h[10] = {
            id(hist1), id(hist2), id(hist3), id(hist4), id(hist5),
            id(hist6), id(hist7), id(hist8), id(hist9), id(hist10)
          };
          for (int i = 9; i > 0; i--) {
            h[i]->publish_state(h[i - 1]->state);
          }
          h[0]->publish_state(ts + " - " + what);

  - id: note_setting
    mode: parallel
    parameters:
      what: string
    then:
      - lambda: |-
          auto t = id(board_time).now();
          std::string ts = t.is_valid() ? t.strftime("%a %H:%M") : std::string("no clock");
          id(last_setting_text).publish_state(ts + " - " + what);
      - script.execute:
          id: note_history
          what: !lambda 'return what;'

  - id: note_light
    mode: parallel
    parameters:
      what: string
    then:
      - lambda: |-
          auto t = id(board_time).now();
          std::string ts = t.is_valid() ? t.strftime("%a %H:%M") : std::string("no clock");
          id(last_light_text).publish_state(ts + " - switched " + what);
      - script.execute:
          id: note_history
          what: !lambda 'return "light switched " + what;'

  - id: note_fan
    mode: parallel
    parameters:
      what: string
    then:
      - lambda: |-
          auto t = id(board_time).now();
          std::string ts = t.is_valid() ? t.strftime("%a %H:%M") : std::string("no clock");
          id(last_fan_text).publish_state(ts + " - " + what);
      - script.execute:
          id: note_history
          what: !lambda 'return "fan " + what;'

  # Works out the misting hours and updates the display
  - id: rebuild_schedule
    mode: single
    then:
      - lambda: |-
          int start = (int) id(mist_start_hour).state;
          int end   = (int) id(mist_end_hour).state;
          int n     = (int) id(mist_count).state;
          if (n < 1) n = 1;
          if (n > 6) n = 6;

          int window = end - start;
          if (window < 0) window += 24;

          int step = 0;
          if (n > 1) {
            step = (window + (n - 1) / 2) / (n - 1);
            if (step < 1) step = 1;
          }

          int cnt = 0;
          int last = -1;
          for (int i = 0; i < n; i++) {
            int offset = i * step;
            if (offset > window) break;
            int h = (start + offset) % 24;
            if (h == last) continue;
            id(mist_hours)[cnt] = h;
            last = h;
            cnt++;
          }
          if (cnt == 0) {
            id(mist_hours)[0] = start;
            cnt = 1;
          }
          id(mist_hours_n) = cnt;
      - component.update: mist_schedule_text

  # Puts the light where it should be for the current hour
  - id: light_check
    mode: single
    then:
      - if:
          condition:
            and:
              - switch.is_on: light_auto_enable
              - lambda: 'return id(board_time).now().is_valid();'
          then:
            - lambda: |-
                int h = id(board_time).now().hour;
                int s = (int) id(light_start_hour).state;
                int e = (int) id(light_end_hour).state;
                bool want;
                if (s == e) want = false;
                else if (s < e) want = (h >= s && h < e);
                else want = (h >= s || h < e);
                if (want != id(puc_light).current_values.is_on()) {
                  if (want) id(puc_light).turn_on().perform();
                  else id(puc_light).turn_off().perform();
                }

  # Runs a full misting cycle in repeating 30 second blocks.
  # Mist On Time sets how much of each block is spraying, the rest is a pause.
  # Blocked only when the water check is on AND the water reads low
  - id: mister_cycle
    mode: restart
    then:
      - if:
          condition:
            and:
              - switch.is_on: water_control
              - binary_sensor.is_on: water_low
          then:
            - lambda: |-
                id(mister).publish_state(false);
                auto t = id(board_time).now();
                std::string ts = t.is_valid() ? t.strftime("%a %H:%M") : std::string("no clock");
                id(last_mist_text).publish_state(ts + " - skipped, water low");
            - script.execute:
                id: note_history
                what: !lambda 'return "mist skipped, water low";'
          else:
            - lambda: |-
                auto t = id(board_time).now();
                std::string ts = t.is_valid() ? t.strftime("%a %H:%M") : std::string("no clock");
                char b[80];
                snprintf(b, sizeof(b), "%s - %.0f min, %.0f sec on in every 30",
                         ts.c_str(), id(mister_run_time).state, id(mist_on_seconds).state);
                id(last_mist_text).publish_state(std::string(b));
                id(mister).publish_state(true);
            - script.execute:
                id: note_history
                what: !lambda |-
                  char c[64];
                  snprintf(c, sizeof(c), "mist started, %.0f min", id(mister_run_time).state);
                  return std::string(c);
            - script.stop: fan_delayed_off
            - script.stop: fan_purge
            - lambda: id(fan_auto) = true;
            - repeat:
                # Each block is 30 seconds, spray time plus pause time
                count: !lambda "return (uint32_t)((id(mister_run_time).state * 60.0) / 30.0);"
                then:
                  - if:
                      condition:
                        or:
                          - switch.is_off: water_control
                          - binary_sensor.is_off: water_low
                      then:
                        # Spray part of the block, skipped when set to 0
                        - if:
                            condition:
                              lambda: 'return id(mist_on_seconds).state >= 1;'
                            then:
                              - fan.turn_on: mister_fan
                              - switch.turn_on: mister_relay
                              - delay: !lambda "return (uint32_t)(id(mist_on_seconds).state * 1000);"
                              - switch.turn_off: mister_relay
                        # Pause part of the block, skipped when set to 30
                        - if:
                            condition:
                              lambda: 'return id(mist_on_seconds).state <= 29;'
                            then:
                              - fan.turn_off: mister_fan
                              - delay: !lambda "return (uint32_t)((30.0 - id(mist_on_seconds).state) * 1000);"
            - script.execute: mister_stop

  # The single shutdown routine everything uses
  - id: mister_stop
    mode: single
    then:
      - lambda: id(mister).publish_state(false);
      - script.stop: mister_cycle
      - switch.turn_off: mister_relay
      - if:
          condition:
            lambda: 'return id(fan_runon_time).state >= 1;'
          then:
            - script.execute: fan_delayed_off
          else:
            - fan.turn_off: mister_fan
            - lambda: |-
                id(fan_auto) = false;
                id(note_fan)->execute(std::string("no run on after mist, set to 0"));

  # Keeps the fan going for a while, then stops it
  - id: fan_delayed_off
    mode: restart
    then:
      - lambda: |-
          char b[48];
          snprintf(b, sizeof(b), "after mist, %.0f min", id(fan_runon_time).state);
          id(note_fan)->execute(std::string(b));
          id(fan_auto) = true;
      - fan.turn_on: mister_fan
      - delay: !lambda "return (uint32_t)(id(fan_runon_time).state * 60000);"
      - fan.turn_off: mister_fan
      - lambda: id(fan_auto) = false;

  # The daily airing run
  - id: fan_purge
    mode: restart
    then:
      - lambda: |-
          char b[48];
          snprintf(b, sizeof(b), "airing, %.0f sec", id(fan_purge_seconds).state);
          id(note_fan)->execute(std::string(b));
          id(fan_auto) = true;
      - fan.turn_on: mister_fan
      - delay: !lambda "return (uint32_t)(id(fan_purge_seconds).state * 1000);"
      - fan.turn_off: mister_fan
      - lambda: id(fan_auto) = false;

  # Waits, airs, repeats, for as long as the switch is on
  - id: fan_cycle_loop
    mode: restart
    then:
      - while:
          condition:
            switch.is_on: fan_cycle_enable
          then:
            - delay: !lambda "return (uint32_t)(id(fan_cycle_hours).state * 3600000);"
            - if:
                condition:
                  and:
                    - switch.is_on: fan_cycle_enable
                    - switch.is_off: mister
                then:
                  - script.execute: fan_purge

switch:
  - platform: gpio
    pin: GPIO16
    id: mister_relay
    internal: true
    restore_mode: ALWAYS_OFF

  # ----- Water -----
  - platform: template
    name: "Enable Water Level Control"
    id: water_control
    icon: "mdi:water-alert"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: grp_water
      sorting_weight: 5
    turn_on_action:
      - lambda: id(note_setting)->execute(std::string("Water Level Control on"));
    turn_off_action:
      - lambda: id(note_setting)->execute(std::string("Water Level Control off"));

  # ----- Light -----
  - platform: template
    name: "Enable Light Automation"
    id: light_auto_enable
    icon: "mdi:lightbulb-auto"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: grp_light
      sorting_weight: 20
    turn_on_action:
      - lambda: id(note_setting)->execute(std::string("Light Automation on"));
      - script.execute: light_check
    turn_off_action:
      - lambda: id(note_setting)->execute(std::string("Light Automation off"));

  # ----- Mister -----
  - platform: template
    name: "Mister"
    id: mister
    icon: "mdi:sprinkler-variant"
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: grp_mist
      sorting_weight: 10
    turn_on_action:
      - script.execute: mister_cycle
    turn_off_action:
      - script.execute: mister_stop

  - platform: template
    name: "Enable Mist Automation"
    id: mist_enable
    icon: "mdi:calendar-clock"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: grp_mist
      sorting_weight: 20
    turn_on_action:
      - lambda: id(note_setting)->execute(std::string("Mist Automation on"));
    turn_off_action:
      - lambda: id(note_setting)->execute(std::string("Mist Automation off"));

  # ----- Fan -----
  - platform: template
    name: "Enable Fan Automation"
    id: fan_cycle_enable
    icon: "mdi:fan-auto"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: grp_fan
      sorting_weight: 20
    turn_on_action:
      - lambda: id(note_setting)->execute(std::string("Fan Automation on"));
      - script.execute: fan_cycle_loop
    turn_off_action:
      - lambda: id(note_setting)->execute(std::string("Fan Automation off"));
      - script.stop: fan_cycle_loop
