# Terrarium Controller - public release build
#
# Change project_version below and push to release a new firmware version.
# Devices already in the field will see the new version within 6 hours
# and offer it as an update.

substitutions:
  device_name: terrarium
  device_friendly_name: Terrarium
  project_version: "1.0.0"
  manifest_url: https://milsky99.github.io/terrarium-controller/firmware/manifest.json

# Board: Generic ESP32 Board (Generic)
esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  # Adds the last 3 bytes of the chip address to the name, so every unit
  # is unique on the network from a single firmware build.
  name_add_mac_suffix: true
  project:
    name: milsky99.terrarium
    version: "${project_version}"
  on_boot:
    priority: 600
    then:
      - switch.turn_off: mister_relay
      - fan.turn_off: mister_fan
      - light.turn_off: puc_light
      - lambda: |-
          id(last_mist_text).publish_state("Never");
          id(last_fan_text).publish_state("Never");
          id(last_light_text).publish_state("Never");
          id(last_setting_text).publish_state("Never");
          id(last_boot_text).publish_state("waiting for clock");
      - script.execute: rebuild_schedule
      - if:
          condition:
            switch.is_on: fan_cycle_enable
          then:
            - script.execute: fan_cycle_loop

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      # Smaller firmware. Only safe because you control which boards ship.
      # Will NOT run on ESP32 chips older than revision 3.1.
      minimum_chip_revision: "3.1"

# Lets Home Assistant offer a one click adopt for this device.
dashboard_import:
  package_import_url: github://milsky99/terrarium-controller/terrarium.yaml@main
  import_full_config: false

logger:
  level: DEBUG
  logs:
    sensor: WARN
    text_sensor: WARN
    number: WARN
    switch: WARN
    light: WARN
    fan: WARN
    script: WARN

# No encryption key here on purpose. A key baked into public firmware
# would be readable by anyone. Home Assistant still finds and adopts it.
api:

ota:
  - platform: esphome
  - platform: http_request

# Used to fetch the update manifest and the new firmware.
http_request:
  verify_ssl: true
  timeout: 10s
  tls_buffer_size_rx: 16384

update:
  - platform: http_request
    name: "Firmware Update"
    id: fw_update
    source: ${manifest_url}
    update_interval: 6h
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 60

# No network saved. On first boot the unit starts its own open hotspot
# called Terrarium Setup. Join it with a phone and the setup page appears.
wifi:
  ap:
    ssid: "Terrarium Setup"
  ap_timeout: 1min

captive_portal:

web_server:
  version: 3
  sorting_groups:
    - id: grp_system
      name: "System"
      sorting_weight: 10
    - id: grp_light
      name: "Light"
      sorting_weight: 20
    - id: grp_water
      name: "Water"
      sorting_weight: 25
    - id: grp_cal
      name: "Water Calibration"
      sorting_weight: 60
    - id: grp_mist
      name: "Mister"
      sorting_weight: 30
    - id: grp_fan
      name: "Fan"
      sorting_weight: 40
    - id: grp_history
      name: "History"
      sorting_weight: 50

time:
  - platform: sntp
    id: board_time
    timezone: Africa/Johannesburg
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        - lambda: |-
            if (!id(boot_logged)) {
              id(boot_logged) = true;
              id(last_boot_text).publish_state(id(board_time).now().strftime("%a %H:%M"));
            }
        - component.update: clock_status
        - script.execute: rebuild_schedule
        - script.execute: light_check
    on_time:
      - seconds: 0
        minutes: 0
        then:
          - script.execute: light_check
          - if:
              condition:
                and:
                  - switch.is_on: mist_enable
                  - lambda: |-
                      int h = id(board_time).now().hour;
                      for (int i = 0; i < id(mist_hours_n); i++) {
                        if (id(mist_hours)[i] == h) return true;
                      }
                      return false;
              then:
                - script.execute: mister_cycle

globals:
  - id: fan_auto
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: boot_logged
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: mist_hours
    type: int[6]
    restore_value: no

  - id: mist_hours_n
    type: int
    restore_value: no
    initial_value: '0'

  # ----- Stored calibration, survives restarts and reflashes -----
  - id: cal_full
    type: float
    restore_value: yes
    initial_value: '500.0'

  - id: cal_empty
    type: float
    restore_value: yes
    initial_value: '1403.0'

  # What happened last: 0 never, 1 full set, 2 empty set, 3 rejected
  - id: cal_last
    type: int
    restore_value: yes
    initial_value: '0'

  - id: cal_value
    type: float
    restore_value: yes
    initial_value: '0.0'

  - id: cal_time
    type: uint32_t
    restore_value: yes
    initial_value: '0'

# ----- Capacitive water probe hub -----
# LEAVE setup_mode ON. The raw value only keeps updating while this is true.
# Turning it off freezes get_value(), which freezes every average below it.
esp32_touch:
  id: touch_hub
  setup_mode: true

binary_sensor:
  # The probe itself. Hidden, it exists only to feed the raw reading.
  # Its threshold is required by ESPHome but is NOT used for any decisions.
  - platform: esp32_touch
    id: water_probe
    pin: GPIO32
    threshold: 1000
    internal: true

  # Low when the percentage drops below the Minimum Water Level slider.
  - platform: template
    id: water_low
    internal: true
    lambda: |-
      if (std::isnan(id(water_percent).state)) return {};
      return id(water_percent).state < id(min_water_level).state;
    filters:
      - delayed_on: 30s
      - delayed_off: 30s
    on_press:
      - if:
          condition:
            and:
              - switch.is_on: water_control
              - switch.is_on: mister
          then:
            - script.execute: mister_stop

sensor:
  - platform: wifi_signal
    id: wifi_signal_db
    internal: true
    update_interval: 60s

  # ----- Water probe -----
  # Samples once a second. Hidden, it only feeds the averages below.
  - platform: template
    id: touch_raw
    internal: true
    lambda: 'return id(water_probe).get_value();'
    update_interval: 1s

  - platform: copy
    source_id: touch_raw
    name: "Probe 10 second"
    id: touch_avg_10s
    icon: "mdi:blur"
    unit_of_measurement: "counts"
    state_class: measurement
    accuracy_decimals: 1
    web_server:
      sorting_group_id: grp_water
      sorting_weight: 30
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

  # This is the one that drives the percentage and the automation.
  - platform: copy
    source_id: touch_raw
    name: "Probe 3 minute"
    id: touch_avg_3m
    icon: "mdi:blur"
    unit_of_measurement: "counts"
    state_class: measurement
    accuracy_decimals: 1
    web_server:
      sorting_group_id: grp_water
      sorting_weight: 40
    filters:
      - sliding_window_moving_average:
          window_size: 180
          send_every: 5

  - platform: copy
    source_id: touch_raw
    name: "Probe 10 minute"
    id: touch_avg_10m
    icon: "mdi:blur"
    unit_of_measurement: "counts"
    state_class: measurement
    accuracy_decimals: 1
    web_server:
      sorting_group_id: grp_water
      sorting_weight: 60
    filters:
      - sliding_window_moving_average:
          window_size: 600
          send_every: 15

  # Percentage worked out from the stored calibration.
  # Works whichever way round full and empty are.
  - platform: template
    name: "Water Level"
    id: water_percent
    icon: "mdi:water-percent"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    web_server:
      sorting_group_id: grp_water
      sorting_weight: 25
    lambda: |-
      float v = id(touch_avg_3m).state;
      if (std::isnan(v)) return {};
      float f = id(cal_full);
      float e = id(cal_empty);
      if (fabsf(f - e) < 1.0f) return {};
      float p = (v - e) / (f - e) * 100.0f;
      if (p < 0.0f) p = 0.0f;
      if (p > 100.0f) p = 100.0f;
      return p;

  # ----- Calibration readouts -----
  - platform: template
    name: "Calibrated Full"
    id: cal_full_display
    icon: "mdi:cup-water"
    unit_of_measurement: "counts"
    accuracy_decimals: 0
    update_interval: 30s
    web_server:
      sorting_group_id: grp_cal
      sorting_weight: 30
    lambda: 'return id(cal_full);'

  - platform: template
    name: "Calibrated Empty"
    id: cal_empty_display
    icon: "mdi:cup-outline"
    unit_of_measurement: "counts"
    accuracy_decimals: 0
    update_interval: 30s
    web_server:
      sorting_group_id: grp_cal
      sorting_weight: 40
    lambda: 'return id(cal_empty);'

button:
  - platform: template
    name: "Set Full"
    icon: "mdi:cup-water"
    web_server:
      sorting_group_id: grp_cal
      sorting_weight: 10
    on_press:
      - script.execute:
          id: store_calibration
          is_full: true

  - platform: template
    name: "Set Empty"
    icon: "mdi:cup-outline"
    web_server:
      sorting_group_id: grp_cal
      sorting_weight: 20
    on_press:
      - script.execute:
          id: store_calibration
          is_full: false

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 50
    ssid:
      name: "Network Name"
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 20
    bssid:
      name: "Router ID"
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 30

  - platform: template
    name: "Clock"
    id: clock_status
    icon: "mdi:clock-outline"
    update_interval: 30s
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 10
    lambda: |-
      auto t = id(board_time).now();
      if (!t.is_valid()) {
        return {"Could not retrieve the time, not connected to the internet, daily misting schedule is not available"};
      }
      return {t.strftime("%H:%M  %a %d %b %Y")};

  - platform: template
    name: "Signal Strength"
    id: wifi_signal_text
    icon: "mdi:wifi"
    update_interval: 300s
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 40
    lambda: |-
      float db = id(wifi_signal_db).state;
      if (std::isnan(db)) return {"no reading"};
      if (db >= -55) return {"████  Excellent"};
      if (db >= -67) return {"███░  Good"};
      if (db >= -75) return {"██░░  Fair"};
      if (db >= -85) return {"█░░░  Weak"};
      return {"░░░░  Very weak"};

  - platform: template
    name: "Water Status"
    id: water_status_text
    icon: "mdi:water-check"
    update_interval: 5s
    web_server:
      sorting_group_id: grp_water
      sorting_weight: 20
    lambda: |-
      if (!id(water_control).state) {
        return {"Water check off - misting always allowed"};
      }
      if (std::isnan(id(water_percent).state)) {
        return {"Warming up - waiting for a stable reading"};
      }
      if (id(water_low).state) {
        return {"Water low ! - automation off"};
      }
      return {"Water level ok - automation running"};

  # ----- Calibration -----
  - platform: template
    name: "How To Calibrate"
    id: cal_help
    icon: "mdi:information-outline"
    update_interval: 300s
    web_server:
      sorting_group_id: grp_cal
      sorting_weight: 5
    lambda: |-
      return {"Wait 3 minutes after filling or emptying before pressing a button. For empty, lift the wire out. When replacing it, push it all the way down into the container or readings will be wrong."};

  - platform: template
    name: "Calibration Status"
    id: cal_status_text
    icon: "mdi:tune-vertical"
    update_interval: 10s
    web_server:
      sorting_group_id: grp_cal
      sorting_weight: 50
    lambda: |-
      char b[120];
      if (id(cal_last) == 0) {
        return {"Never calibrated - using built in values"};
      }
      std::string ts = "no clock";
      if (id(cal_time) > 0) {
        ts = ESPTime::from_epoch_local(id(cal_time)).strftime("%a %H:%M");
      }
      if (id(cal_last) == 3) {
        snprintf(b, sizeof(b), "Rejected %.0f - too close to the other value. Nothing changed. %s",
                 id(cal_value), ts.c_str());
      } else {
        snprintf(b, sizeof(b), "%s set to %.0f - %s",
                 id(cal_last) == 1 ? "Full" : "Empty", id(cal_value), ts.c_str());
      }
      return {std::string(b)};

  - platform: template
    name: "Mist Times"
    id: mist_schedule_text
    icon: "mdi:calendar-clock"
    update_interval: never
    web_server:
      sorting_group_id: grp_mist
      sorting_weight: 30
    lambda: |-
      std::string s = "";
      char buf[8];
      for (int i = 0; i < id(mist_hours_n); i++) {
        snprintf(buf, sizeof(buf), "%02d:00", id(mist_hours)[i]);
        if (i > 0) s += ", ";
        s += buf;
      }
      if (s.empty()) s = "none";
      return {s};

  # Plain english readout of the burst pattern
  - platform: template
    name: "Mist Pattern"
    id: mist_pattern_text
    icon: "mdi:chart-timeline-variant"
    update_interval: 30s
    web_server:
      sorting_group_id: grp_mist
      sorting_weight: 85
    lambda: |-
      int on = (int) id(mist_on_seconds).state;
      int off = 30 - on;
      char b[80];
      if (on <= 0) {
        return {"Off time only - the mister will not run"};
      }
      if (off <= 0) {
        return {"Runs without stopping for the whole mist duration"};
      }
      snprintf(b, sizeof(b), "%d sec on, %d sec off, repeating", on, off);
      return {std::string(b)};

  # ----- History -----
  - platform: template
    name: "Last Mist"
    id: last_mist_text
    icon: "mdi:sprinkler-variant"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 10

  - platform: template
    name: "Last Fan Run"
    id: last_fan_text
    icon: "mdi:fan"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 20

  - platform: template
    name: "Last Light Change"
    id: last_light_text
    icon: "mdi:lightbulb"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 30

  - platform: template
    name: "Last Setting Change"
    id: last_setting_text
    icon: "mdi:tune"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 40

  - platform: template
    name: "Last Boot"
    id: last_boot_text
    icon: "mdi:restart"
    update_interval: never
    web_server:
      sorting_group_id: grp_history
      sorting_weight: 50

number:
  # ----- Water -----
  # Misting stops below this percentage, as long as Water Level Control is on.
  - platform: template
    name: "Minimum Water Level"
    id: min_water_level
    icon: "mdi:water-alert-outline"
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 15
    max_value: 40
    step: 5
    unit_of_measurement: "%"
    mode: slider
    web_server:
      sorting_group_id: grp_water
      sorting_weight: 15
    on_value:
      - lambda: |-
          char b[64];
          snprintf(b, sizeof(b), "Minimum Water Level to %.0f%%", x);
          id(note_setting)->execute(std::string(b));

  # ----- Light -----
  - platform: template
    name: "Light On Hour"
    id: light_start_hour
    icon: "mdi:weather-sunny"
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 0
    max_value: 23
    step: 1
    unit_of_measurement: "h"
    mode: slider
    web_server:
      sorting_group_id: grp_light
      sorting_weight: 30
    on_value:
      - lambda: |-
          char b[64];
          snprintf(b, sizeof(b), "Light On Hour to %02.0f:00", x);
          id(note_setting)->execute(std::string(b));
      - script.execute: light_check

  - platform: template
    name: "Light Off Hour"
    id: light_end_hour
    icon: "mdi:weather-night"
    optimistic: true
    restore_value: true
    initial_value: 22
    min_value: 0
    max_value: 23
    step: 1
    unit_of_measurement: "h"
    mode: slider
    web_server:
      sorting_group_id: grp_light
      sorting_weight: 40
    on_value:
      - lambda: |-
          char b[64];
          snprintf(b, sizeof(b), "Light Off Hour to %02.0f:00", x);
          id(note_setting)->execute(std::string(b));
      - script.execute: light_check

  # ----- Mister -----
  - platform: template
    name: "Mist Start Hour"
    id: mist_start_hour
    icon: "mdi:clock-start"
    optimistic: true
    restore_value: true
    initial_value: 19
    min_value: 0
    max_value: 23
    step: 1
    unit_of_measurement: "h"
    mode: slider
    web_server:
      sorting_group_id: grp_mist
      sorting_weight: 40
    on_value:
      - lambda: |-
          char b[64];
          snprintf(b, sizeof(b), "Mist Start Hour to %02.0f:00", x);
          id(note_setting)->execute(std::string(b));
      - script.execute: rebuild_schedule

  - platform: template
    name: "Mist End Hour"
    id: mist_end_hour
    icon: "mdi:clock-end"
    optimistic: true
    restore_value: true
    initial_value: 23
    min_value: 0
    max_value: 23
    step: 1
    unit_of_measurement: "h"
    mode: slider
    web_server:
      sorting_group_id: grp_mist
      sorting_weight: 50
    on_value:
      - lambda: |-
          char b[64];
          snprintf(b, sizeof(b), "Mist End Hour to %02.0f:00", x);
          id(note_setting)->execute(std::string(b));
      - script.execute: rebuild_schedule

  - platform: template
    name: "Mists Per Day"
    id: mist_count
    icon: "mdi:counter"
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 1
    max_value: 6
    step: 1
    mode: slider
    web_server:
      sorting_group_id: grp_mist
      sorting_weight: 60
    on_value:
      - lambda: |-
          char b[64];
          snprintf(b, sizeof(b), "Mists Per Day to %.0f", x);
          id(note_setting)->execute(std::string(b));
      - script.execute: rebuild_schedule

  - platform: template
    name: "Mist Duration"
    id: mister_run_time
    icon: "mdi:timer-outline"
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 1
    max_value: 10
    step: 1
    unit_of_measurement: "min"
    mode: slider
    web_server:
      sorting_group_id: grp_mist
      sorting_weight: 70
    on_value:
      - lambda: |-
          char b[64];
          snprintf(b, sizeof(b), "Mist Duration to %.0f min", x);
          id(note_setting)->execute(std::string(b));

  # How many of every 30 seconds the mister is actually spraying.
  # 30 means it never pauses. 0 means it never sprays.
  - platform: template
    name: "Mist On Time"
    id: mist_on_seconds
    icon: "mdi:timer-play-outline"
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 0
    max_value: 30
    step: 1
    unit_of_measurement: "s"
    mode: slider
    web_server:
      sorting_group_id: grp_mist
      sorting_weight: 80
    on_value:
      - lambda: |-
          char b[72];
          snprintf(b, sizeof(b), "Mist On Time to %.0f sec in every 30", x);
          id(note_setting)->execute(std::string(b));
      - component.update: mist_pattern_text

  # ----- Fan -----
  # How long to wait between daily airings.
  - platform: template
    name: "Daily Fan Cycle Interval"
    id: fan_cycle_hours
    icon: "mdi:timer-sync-outline"
    optimistic: true
    restore_value: true
    initial_value: 4
    min_value: 1
    max_value: 6
    step: 1
    unit_of_measurement: "h"
    mode: slider
    web_server:
      sorting_group_id: grp_fan
      sorting_weight: 30
    on_value:
      - lambda: |-
          char b[64];
          snprintf(b, sizeof(b), "Daily Fan Cycle Interval to %.0f h", x);
          id(note_setting)->execute(std::string(b));

  # How long each daily airing lasts.
  - platform: template
    name: "Daily Fan Run Time"
    id: fan_purge_seconds
    icon: "mdi:fan-clock"
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 10
    max_value: 300
    step: 10
    unit_of_measurement: "s"
    mode: slider
    web_server:
      sorting_group_id: grp_fan
      sorting_weight: 35
    on_value:
      - lambda: |-
          char b[64];
          snprintf(b, sizeof(b), "Daily Fan Run Time to %.0f sec", x);
          id(note_setting)->execute(std::string(b));

  # How long the fan keeps going once misting ends. 0 means it does not run on.
  - platform: template
    name: "Fan Run After Mist"
    id: fan_runon_time
    icon: "mdi:fan-plus"
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 0
    max_value: 5
    step: 1
    unit_of_measurement: "min"
    mode: slider
    web_server:
      sorting_group_id: grp_fan
      sorting_weight: 40
    on_value:
      - lambda: |-
          char b[72];
          if (x < 1) {
            id(note_setting)->execute(std::string("Fan Run After Mist off"));
          } else {
            snprintf(b, sizeof(b), "Fan Run After Mist to %.0f min", x);
            id(note_setting)->execute(std::string(b));
          }

output:
  - platform: gpio
    pin: GPIO26
    id: light_output
  - platform: gpio
    pin: GPIO17
    id: fan_output

light:
  - platform: binary
    name: "Light"
    id: puc_light
    output: light_output
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: grp_light
      sorting_weight: 10
    on_turn_on:
      - lambda: id(note_light)->execute(std::string("on"));
    on_turn_off:
      - lambda: id(note_light)->execute(std::string("off"));

fan:
  - platform: binary
    name: "Fan"
    id: mister_fan
    output: fan_output
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: grp_fan
      sorting_weight: 10
    on_turn_off:
      - if:
          condition:
            lambda: 'return !id(fan_auto);'
          then:
            - if:
                condition:
                  switch.is_on: mister
                then:
                  - script.execute: mister_stop
                else:
                  - if:
                      condition:
                        lambda: 'return id(fan_runon_time).state >= 1;'
                      then:
                        - script.execute: fan_delayed_off

script:
  # Stores the current 3 minute average as full or empty.
  # Refuses if the two points would end up within 100 counts of each other.
  - id: store_calibration
    mode: single
    parameters:
      is_full: bool
    then:
      - lambda: |-
          float v = id(touch_avg_3m).state;
          auto n = id(board_time).now();
          id(cal_time) = n.is_valid() ? n.timestamp : 0;

          if (std::isnan(v)) {
            id(cal_last) = 3;
            id(cal_value) = 0;
            return;
          }

          float other = is_full ? id(cal_empty) : id(cal_full);
          if (fabsf(v - other) < 100.0f) {
            id(cal_last) = 3;
            id(cal_value) = v;
            return;
          }

          if (is_full) {
            id(cal_full) = v;
            id(cal_last) = 1;
          } else {
            id(cal_empty) = v;
            id(cal_last) = 2;
          }
          id(cal_value) = v;
      - component.update: cal_status_text
      - component.update: cal_full_display
      - component.update: cal_empty_display

  # ----- History helpers -----
  - id: note_setting
    mode: parallel
    parameters:
      what: string
    then:
      - lambda: |-
          auto t = id(board_time).now();
          std::string ts = t.is_valid() ? t.strftime("%a %H:%M") : std::string("no clock");
          id(last_setting_text).publish_state(ts + " - " + what);

  - id: note_light
    mode: parallel
    parameters:
      what: string
    then:
      - lambda: |-
          auto t = id(board_time).now();
          std::string ts = t.is_valid() ? t.strftime("%a %H:%M") : std::string("no clock");
          id(last_light_text).publish_state(ts + " - switched " + what);

  - id: note_fan
    mode: parallel
    parameters:
      what: string
    then:
      - lambda: |-
          auto t = id(board_time).now();
          std::string ts = t.is_valid() ? t.strftime("%a %H:%M") : std::string("no clock");
          id(last_fan_text).publish_state(ts + " - " + what);

  # Works out the misting hours and updates the display
  - id: rebuild_schedule
    mode: single
    then:
      - lambda: |-
          int start = (int) id(mist_start_hour).state;
          int end   = (int) id(mist_end_hour).state;
          int n     = (int) id(mist_count).state;
          if (n < 1) n = 1;
          if (n > 6) n = 6;

          int window = end - start;
          if (window < 0) window += 24;

          int step = 0;
          if (n > 1) {
            step = (window + (n - 1) / 2) / (n - 1);
            if (step < 1) step = 1;
          }

          int cnt = 0;
          int last = -1;
          for (int i = 0; i < n; i++) {
            int offset = i * step;
            if (offset > window) break;
            int h = (start + offset) % 24;
            if (h == last) continue;
            id(mist_hours)[cnt] = h;
            last = h;
            cnt++;
          }
          if (cnt == 0) {
            id(mist_hours)[0] = start;
            cnt = 1;
          }
          id(mist_hours_n) = cnt;
      - component.update: mist_schedule_text

  # Puts the light where it should be for the current hour
  - id: light_check
    mode: single
    then:
      - if:
          condition:
            and:
              - switch.is_on: light_auto_enable
              - lambda: 'return id(board_time).now().is_valid();'
          then:
            - lambda: |-
                int h = id(board_time).now().hour;
                int s = (int) id(light_start_hour).state;
                int e = (int) id(light_end_hour).state;
                bool want;
                if (s == e) want = false;
                else if (s < e) want = (h >= s && h < e);
                else want = (h >= s || h < e);
                if (want != id(puc_light).current_values.is_on()) {
                  if (want) id(puc_light).turn_on().perform();
                  else id(puc_light).turn_off().perform();
                }

  # Runs a full misting cycle in repeating 30 second blocks.
  # Mist On Time sets how much of each block is spraying, the rest is a pause.
  # Blocked only when the water check is on AND the water reads low
  - id: mister_cycle
    mode: restart
    then:
      - if:
          condition:
            and:
              - switch.is_on: water_control
              - binary_sensor.is_on: water_low
          then:
            - lambda: |-
                id(mister).publish_state(false);
                auto t = id(board_time).now();
                std::string ts = t.is_valid() ? t.strftime("%a %H:%M") : std::string("no clock");
                id(last_mist_text).publish_state(ts + " - skipped, water low");
          else:
            - lambda: |-
                auto t = id(board_time).now();
                std::string ts = t.is_valid() ? t.strftime("%a %H:%M") : std::string("no clock");
                char b[80];
                snprintf(b, sizeof(b), "%s - %.0f min, %.0f sec on in every 30",
                         ts.c_str(), id(mister_run_time).state, id(mist_on_seconds).state);
                id(last_mist_text).publish_state(std::string(b));
                id(mister).publish_state(true);
            - script.stop: fan_delayed_off
            - script.stop: fan_purge
            - lambda: id(fan_auto) = true;
            - repeat:
                # Each block is 30 seconds, spray time plus pause time
                count: !lambda "return (uint32_t)((id(mister_run_time).state * 60.0) / 30.0);"
                then:
                  - if:
                      condition:
                        or:
                          - switch.is_off: water_control
                          - binary_sensor.is_off: water_low
                      then:
                        # Spray part of the block, skipped when set to 0
                        - if:
                            condition:
                              lambda: 'return id(mist_on_seconds).state >= 1;'
                            then:
                              - fan.turn_on: mister_fan
                              - switch.turn_on: mister_relay
                              - delay: !lambda "return (uint32_t)(id(mist_on_seconds).state * 1000);"
                              - switch.turn_off: mister_relay
                        # Pause part of the block, skipped when set to 30
                        - if:
                            condition:
                              lambda: 'return id(mist_on_seconds).state <= 29;'
                            then:
                              - fan.turn_off: mister_fan
                              - delay: !lambda "return (uint32_t)((30.0 - id(mist_on_seconds).state) * 1000);"
            - script.execute: mister_stop

  # The single shutdown routine everything uses
  - id: mister_stop
    mode: single
    then:
      - lambda: id(mister).publish_state(false);
      - script.stop: mister_cycle
      - switch.turn_off: mister_relay
      - if:
          condition:
            lambda: 'return id(fan_runon_time).state >= 1;'
          then:
            - script.execute: fan_delayed_off
          else:
            - fan.turn_off: mister_fan
            - lambda: |-
                id(fan_auto) = false;
                id(note_fan)->execute(std::string("no run on after mist, set to 0"));

  # Keeps the fan going for a while, then stops it
  - id: fan_delayed_off
    mode: restart
    then:
      - lambda: |-
          char b[48];
          snprintf(b, sizeof(b), "after mist, %.0f min", id(fan_runon_time).state);
          id(note_fan)->execute(std::string(b));
          id(fan_auto) = true;
      - fan.turn_on: mister_fan
      - delay: !lambda "return (uint32_t)(id(fan_runon_time).state * 60000);"
      - fan.turn_off: mister_fan
      - lambda: id(fan_auto) = false;

  # The daily airing run
  - id: fan_purge
    mode: restart
    then:
      - lambda: |-
          char b[48];
          snprintf(b, sizeof(b), "airing, %.0f sec", id(fan_purge_seconds).state);
          id(note_fan)->execute(std::string(b));
          id(fan_auto) = true;
      - fan.turn_on: mister_fan
      - delay: !lambda "return (uint32_t)(id(fan_purge_seconds).state * 1000);"
      - fan.turn_off: mister_fan
      - lambda: id(fan_auto) = false;

  # Waits, airs, repeats, for as long as the switch is on
  - id: fan_cycle_loop
    mode: restart
    then:
      - while:
          condition:
            switch.is_on: fan_cycle_enable
          then:
            - delay: !lambda "return (uint32_t)(id(fan_cycle_hours).state * 3600000);"
            - if:
                condition:
                  and:
                    - switch.is_on: fan_cycle_enable
                    - switch.is_off: mister
                then:
                  - script.execute: fan_purge

switch:
  - platform: gpio
    pin: GPIO16
    id: mister_relay
    internal: true
    restore_mode: ALWAYS_OFF

  # ----- Water -----
  - platform: template
    name: "Enable Water Level Control"
    id: water_control
    icon: "mdi:water-alert"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: grp_water
      sorting_weight: 5
    turn_on_action:
      - lambda: id(note_setting)->execute(std::string("Water Level Control on"));
    turn_off_action:
      - lambda: id(note_setting)->execute(std::string("Water Level Control off"));

  # ----- Light -----
  - platform: template
    name: "Enable Light Automation"
    id: light_auto_enable
    icon: "mdi:lightbulb-auto"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: grp_light
      sorting_weight: 20
    turn_on_action:
      - lambda: id(note_setting)->execute(std::string("Light Automation on"));
      - script.execute: light_check
    turn_off_action:
      - lambda: id(note_setting)->execute(std::string("Light Automation off"));

  # ----- Mister -----
  - platform: template
    name: "Mister"
    id: mister
    icon: "mdi:sprinkler-variant"
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: grp_mist
      sorting_weight: 10
    turn_on_action:
      - script.execute: mister_cycle
    turn_off_action:
      - script.execute: mister_stop

  - platform: template
    name: "Enable Mist Automation"
    id: mist_enable
    icon: "mdi:calendar-clock"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: grp_mist
      sorting_weight: 20
    turn_on_action:
      - lambda: id(note_setting)->execute(std::string("Mist Automation on"));
    turn_off_action:
      - lambda: id(note_setting)->execute(std::string("Mist Automation off"));

  # ----- Fan -----
  - platform: template
    name: "Enable Fan Automation"
    id: fan_cycle_enable
    icon: "mdi:fan-auto"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: grp_fan
      sorting_weight: 20
    turn_on_action:
      - lambda: id(note_setting)->execute(std::string("Fan Automation on"));
      - script.execute: fan_cycle_loop
    turn_off_action:
      - lambda: id(note_setting)->execute(std::string("Fan Automation off"));
      - script.stop: fan_cycle_loop

  - platform: gpio
    pin: GPIO23
    name: "InternalLED"
    id: internalled
    internal: true
    restore_mode: ALWAYS_OFF
