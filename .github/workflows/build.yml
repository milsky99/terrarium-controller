name: Build and publish firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the firmware
        id: build
        uses: esphome/build-action@v7.0.0
        with:
          yaml-file: terrarium.yaml
          complete-manifest: true

      - name: Lay out the website folder
        run: |
          mkdir -p site/firmware
          cp -R "${{ steps.build.outputs.name }}"/* site/firmware/
          ls -la site/firmware

      - name: Package the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
